    <link rel="dns-prefetch" href="//fonts.googleapis.com" />

    <link rel="preload" href="/lovable-uploads/6deaefc6-eeb6-4776-8a8c-606a14cfd347.png?v=20250804001" as="image" />

    <!-- OG, Twitter, and Canonical managed dynamically by react-helmet-async in SEOHead.tsx -->
    
    <!-- Critical CSS inlined for faster first paint -->
    <style>
      :root {
        --background: 45 29% 97%;
        --foreground: 77 19% 29%;
        --primary: 183 48% 21%;
        --primary-foreground: 45 29% 97%;
        --secondary: 77 19% 35%;
        --muted-foreground: 77 15% 45%;
        --font-display: 'Playfair Display', serif;
        --font-body: 'Roboto', sans-serif;
      }
      
      * { box-sizing: border-box; }
      
      body {
        margin: 0;
        padding: 0;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: var(--font-body), sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      #root {
        min-height: 100vh;
      }
      
      .skip-link {
        position: absolute;
        top: -40px;
        left: 6px;
        background: hsl(var(--primary));
        color: hsl(var(--primary-foreground));
        padding: 8px;
        text-decoration: none;
        border-radius: 4px;
        z-index: 1000;
      }
      
      .skip-link:focus {
        top: 6px;
      }
      
      img {
        height: auto;
        max-width: 100%;
      }
      
      /* Hide content until CSS loads to prevent FOUC */
      .app-loading #root {
        visibility: hidden;
      }
    </style>
    
    <!-- Preload main CSS file -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "COIREA",
      "description": "Regenerative consultancy helping organizations realign their systems, culture, and leadership through structural and human transformation.",
      "url": "https://coirea.com",
      "logo": "https://coirea.com/lovable-uploads/5555f545-a4bb-46b7-9145-b8ae36a5d882.png",
      "image": "https://coirea.com/lovable-uploads/9bef76c3-5f6e-42a0-831c-3a54ef706f9b.png",
      "foundingDate": "2024",
      "industry": "Management Consulting",
      "keywords": "organizational transformation, regenerative business, conscious leadership, team retreats, organizational development"
    }
    </script>
  </head>

  <body class="app-loading">
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- CSS loading optimization -->
    <script>
      // Remove loading class once CSS is loaded
      document.addEventListener('DOMContentLoaded', function() {
        document.body.classList.remove('app-loading');
      });
      
      // Fallback for CSS loading
      window.addEventListener('load', function() {
        document.body.classList.remove('app-loading');
      });
    </script>
    
    <!-- Performance monitoring (placeholder for future analytics) -->
    <script>
      // Basic performance monitoring
      window.addEventListener('load', function() {
        if ('performance' in window && 'measure' in performance) {
          const loadTime = performance.timing.loadEventEnd - performance.timing.navigationStart;
          console.log('Page load time:', loadTime + 'ms');
        }
      });
    </script>
  </body>
