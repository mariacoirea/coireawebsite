<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Misty regenerative landscape for COIREA conversation page</title>
  <desc id="desc">Layered green mountains, soft morning light, forest canopy, and subtle topographic lines inspired by COIREA's nature-based visual identity.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eadb"/>
      <stop offset=".38" stop-color="#d9d8c7"/>
      <stop offset=".72" stop-color="#8fa18e"/>
      <stop offset="1" stop-color="#173b2c"/>
    </linearGradient>
    <linearGradient id="light" x1=".86" y1=".02" x2=".22" y2=".86">
      <stop offset="0" stop-color="#f6d28f" stop-opacity=".72"/>
      <stop offset=".22" stop-color="#f3eadb" stop-opacity=".34"/>
      <stop offset=".58" stop-color="#5f765e" stop-opacity=".12"/>
      <stop offset="1" stop-color="#102f23" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountainA" x1="0" y1=".1" x2="1" y2="1">
      <stop offset="0" stop-color="#cfd5c1" stop-opacity=".86"/>
      <stop offset=".48" stop-color="#6f866d" stop-opacity=".9"/>
      <stop offset="1" stop-color="#173b2c"/>
    </linearGradient>
    <linearGradient id="mountainB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a9c82"/>
      <stop offset=".62" stop-color="#37583f"/>
      <stop offset="1" stop-color="#102f23"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55704e"/>
      <stop offset=".62" stop-color="#173b2c"/>
      <stop offset="1" stop-color="#09251b"/>
    </linearGradient>
    <radialGradient id="mist" cx=".46" cy=".48" r=".68">
      <stop offset="0" stop-color="#f3eadb" stop-opacity=".46"/>
      <stop offset=".42" stop-color="#f3eadb" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f3eadb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1800" height="980" fill="url(#sky)"/>
  <rect width="1800" height="980" fill="url(#light)"/>

  <path d="M0 496 C158 418 268 430 392 350 C512 272 641 278 772 363 C892 441 985 405 1100 318 C1257 200 1425 200 1586 314 C1686 385 1757 388 1800 370 L1800 980 L0 980 Z" fill="url(#mountainA)" opacity=".76"/>
  <path d="M0 590 C171 512 309 521 451 455 C616 378 734 430 858 518 C978 604 1105 554 1238 455 C1406 330 1601 370 1800 512 L1800 980 L0 980 Z" fill="url(#mountainB)" opacity=".82"/>
  <path d="M0 676 C165 617 321 608 497 557 C681 504 819 556 982 642 C1133 721 1288 640 1425 566 C1572 486 1696 547 1800 613 L1800 980 L0 980 Z" fill="#173b2c" opacity=".84"/>
  <path d="M0 760 C163 713 318 744 467 695 C615 646 751 670 889 742 C1043 823 1176 748 1322 687 C1502 612 1652 687 1800 733 L1800 980 L0 980 Z" fill="url(#canopy)"/>

  <g opacity=".34" filter="url(#soften)">
    <path d="M20 548 C226 497 387 550 540 506 C738 450 831 473 1035 506 C1236 539 1400 491 1598 528 C1694 546 1753 543 1800 535 L1800 648 C1604 666 1430 629 1251 641 C1059 654 901 626 734 624 C535 621 328 651 146 632 C72 625 27 627 0 634 Z" fill="url(#mist)"/>
    <path d="M0 430 C140 393 247 431 371 407 C527 376 639 357 790 392 C978 436 1110 407 1260 380 C1461 344 1633 393 1800 367 L1800 466 C1607 484 1479 463 1306 481 C1131 498 962 473 774 464 C570 455 412 474 243 480 C128 484 51 467 0 488 Z" fill="#f3eadb" opacity=".28"/>
  </g>

  <g fill="none" stroke="#f3eadb" stroke-opacity=".18" stroke-width="2">
    <path d="M1162 178 C1233 138 1322 133 1393 176 C1469 222 1498 310 1455 380 C1418 440 1337 465 1268 434 C1192 400 1147 325 1167 254 C1182 199 1233 169 1290 174 C1368 181 1414 241 1404 306 C1394 372 1326 406 1265 380 C1211 356 1184 300 1204 254 C1221 215 1261 198 1301 208 C1345 219 1373 255 1365 295"/>
    <path d="M128 696 C216 644 319 650 389 714 C459 778 445 867 366 906 C280 948 165 907 132 819 C105 746 151 684 223 679 C295 674 349 720 350 781 C351 835 307 873 255 859"/>
    <path d="M1392 598 C1482 540 1594 552 1668 624 C1742 696 1716 795 1618 830 C1513 868 1390 805 1379 700 C1372 633 1416 589 1480 586 C1549 583 1602 629 1603 689"/>
  </g>

  <g opacity=".5">
    <circle cx="1535" cy="118" r="74" fill="#f3d18b" opacity=".28"/>
    <circle cx="1535" cy="118" r="146" fill="#f3d18b" opacity=".08"/>
  </g>

  <rect width="1800" height="980" fill="#09251b" opacity=".15"/>
  <rect width="1800" height="980" filter="url(#grain)" opacity=".42"/>
</svg>
